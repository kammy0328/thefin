</a>

<header id="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo" aria-label="THE FIN 홈으로">
      <span class="logo-word">THE<span class="logo-box">FIN</span></span>

    <nav id="site-nav" class="site-nav">

      <span>010-5823-1350</span>

    <button id="nav-toggle" class="nav-toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>

  <section class="section section-dark page-hero">
    <div class="container">
      <p class="eyebrow reveal">CONTACT</p>
      <h1 class="page-title reveal">지금 바로 문의하세요</h1>
    </div>
  </section>

  <section class="section section-light">
    <div class="container">
      <div class="contact-wrap">
        <div class="contact-phone reveal">
          <a href="tel:01058231350" class="phone-link">010-5823-1350</a>
          <button type="button" id="copy-phone" class="btn btn-outline btn-small">번호 복사하기</button>
          <p class="contact-hint">평일 10:00 – 19:00 (문자 상담 가능)</p>
        </div>

        <form id="contact-form" class="contact-form reveal" novalidate>
          <div class="field">
            <label for="name">이름 / 회사명</label>
            <input type="text" id="name" name="name" required autocomplete="name">
          </div>
          <div class="field">
            <label for="phone">연락처</label>
            <input type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="010-0000-0000">
          </div>
          <div class="field">
            <label for="message">문의 내용</label>
            <textarea id="message" name="message" rows="4" required placeholder="어떤 작업이 필요하신가요? (리무브 / 뷰티 / 합성 / 3D / VFX)"></textarea>
          </div>
          <button type="submit" class="btn btn-solid btn-full">문자로 문의 보내기</button>
          <p class="form-note">버튼을 누르면 입력하신 내용으로 문자 메시지 화면이 열립니다.</p>
        </form>
      </div>
    </div>
  </section>

</main>
